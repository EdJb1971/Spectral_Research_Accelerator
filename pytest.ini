[pytest]
testpaths = src/tests

# Pytest writes its `tmp_path` / `tmp_path_factory` fixtures under `basetemp`, which defaults to
# the system temp directory -- on this machine `C:\Users\...\AppData\Local\Temp`. Several suites
# materialise real Zarr stores and NetCDF files there, so a full C: drive does not produce a
# clear "out of disk" message: it produces `OSError: [Errno 28] No space left on device` inside
# a fixture, which pytest reports as 35 failures and 49 errors across unrelated suites. That is
# indistinguishable from a code regression at a glance, and it truncated the run log as well, so
# the evidence needed to tell the difference was itself lost.
#
# Pinning basetemp to the repo drive removes the failure mode entirely: D: is where the data
# already lives, and `DEFAULT_CACHE_DIR` (`data/zarr_cache`) is relative to the repo for the same
# reason. Pytest keeps the three most recent runs here and removes older ones itself.
addopts = --basetemp=.pytest-basetemp
