# Alembic configuration (roadmap T3.5.8, defect D31-adjacent).
#
# `sqlalchemy.url` is deliberately left EMPTY. The URL is resolved in
# `migrations/env.py` from `src.database.session.DATABASE_URL`, which reads the
# DATABASE_URL environment variable. Duplicating the URL here would create a second
# source of truth, and the failure mode of that is migrating a different database
# from the one the application uses - silently, and in a way that looks like the
# migration "did nothing".

[alembic]
script_location = migrations
prepend_sys_path = .
# Alembic 1.16+ warns unless the separator for prepend_sys_path is explicit.
path_separator = os
# Sequential numeric filenames so `ls versions/` reads in application order.
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
